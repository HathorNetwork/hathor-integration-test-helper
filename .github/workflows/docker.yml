name: docker

# Publishes the Docker image to DockerHub when a maintainer deliberately
# pushes a `v*` version tag. The only gate is that the tagged commit must be
# an ancestor of `main`: branch protection guarantees nothing reaches `main`
# without passing CI and review, so "on main" already proves "CI is green".
# We therefore do NOT re-run CI here.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE: docker.io/hathornetwork/hathor-integration-test-helper

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # fetch-depth: 0 so the ancestry check below has full history.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # No git auth is needed after checkout (public repo, read-only
          # fetch), so don't leave the token persisted in .git/config.
          persist-credentials: false

      - name: Verify tag points to a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit on main. Refusing to publish."
            exit 1
          fi

      - name: Resolve and verify version
        id: tags
        run: |
          # `package.json` is the source of truth for the published version;
          # the tag only selects which commit ships. Requiring the two to
          # agree is what stops a `v0.0.2` tag from publishing an image whose
          # manifest still reads `0.0.1`.
          tag_version="${GITHUB_REF_NAME#v}"
          # Reject anything that isn't a clean stable vMAJOR.MINOR.PATCH tag,
          # so a stray tag can't yield an invalid image tag or smuggle extra
          # comma-separated tags into the publish list. Pre-releases are
          # disallowed since `latest` is always applied and must only ever
          # track a stable release.
          if ! [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not a valid vMAJOR.MINOR.PATCH version. Refusing to publish."
            exit 1
          fi
          pkg_version="$(jq -er .version package.json)"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::package.json version (${pkg_version}) does not match tag ${GITHUB_REF_NAME}. Refusing to publish."
            exit 1
          fi
          echo "version=${pkg_version}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${pkg_version},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          # A published version is immutable: republishing would swap the
          # image out from under consumers already pinned to it. Re-tagging
          # an existing version passes the tag/manifest match above, so this
          # is the only thing that catches it. The fix is always a bump.
          if docker manifest inspect "${IMAGE}:${VERSION}" > /dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} is already published and versions are immutable. Bump the version in package.json, merge, then tag the new version."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
